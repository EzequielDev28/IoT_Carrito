<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Controller - AWS EC2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id="alertContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <header>
        <div class="d-flex align-items-center">
            <h1 class="me-3"><i class="bi bi-cpu-fill me-2"></i>IoT Center</h1>
            <div class="d-flex align-items-center bg-dark px-2 py-1 rounded border border-secondary">
                <span class="live-indicator" id="wsStatusDot"></span>
                <span class="text-xs text-muted me-2">WS MOV:</span>
                <span id="wsMovementStatus" class="text-xs fw-bold text-secondary me-3">...</span>
                <span class="text-xs text-muted me-2">WS OBS:</span>
                <span id="wsObstacleStatus" class="text-xs fw-bold text-secondary">...</span>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-dark text-muted border-secondary">ID</span>
                <input type="text" id="deviceInput" class="form-control bg-dark text-light border-secondary" value="carrito-alpha" onchange="updateDeviceName(this.value)">
            </div>
        </div>
    </header>

    <div class="dashboard-main">

        <section class="panel-control">
            
            <div class="control-layout">
                <div class="col-movement">
                    <div class="card-custom h-100">
                        <div class="card-header-custom">
                            <span><i class="bi bi-dpad-fill me-2"></i>Control Manual</span>
                            <select id="speedSelector" class="form-select form-select-sm bg-dark text-light border-secondary w-auto py-0" style="height: 24px; font-size: 0.7rem;">
                                <option value="100">Lenta (100)</option>
                                <option value="180" selected>Normal (180)</option>
                                <option value="255">Turbo (255)</option>
                            </select>
                        </div>
                        <div class="card-body-custom p-2">
                            <div class="gamepad-grid">
                                <button class="btn-gamepad" onclick="sendMovement(5)"><i class="bi bi-arrow-up-left"></i><span>V.Izq(5)</span></button>
                                <button class="btn-gamepad bg-primary border-primary" onclick="sendMovement(1)"><i class="bi bi-arrow-up"></i><span>Adelante(1)</span></button>
                                <button class="btn-gamepad" onclick="sendMovement(4)"><i class="bi bi-arrow-up-right"></i><span>V.Der(4)</span></button>
                                
                                <button class="btn-gamepad" onclick="sendMovement(9)"><i class="bi bi-arrow-counterclockwise"></i><span>90° Izq(9)</span></button>
                                <button class="btn-gamepad btn-stop" onclick="sendMovement(3)"><i class="bi bi-stop-fill"></i><span>STOP(3)</span></button>
                                <button class="btn-gamepad" onclick="sendMovement(8)"><i class="bi bi-arrow-clockwise"></i><span>90° Der(8)</span></button>
                                
                                <button class="btn-gamepad" onclick="sendMovement(7)"><i class="bi bi-arrow-down-left"></i><span>V.Atr.I(7)</span></button>
                                <button class="btn-gamepad bg-warning text-dark border-warning" onclick="sendMovement(2)"><i class="bi bi-arrow-down"></i><span>Atrás(2)</span></button>
                                <button class="btn-gamepad" onclick="sendMovement(6)"><i class="bi bi-arrow-down-right"></i><span>V.Atr.D(6)</span></button>

                                <button class="btn-gamepad" onclick="sendMovement(11)"><i class="bi bi-repeat"></i><span>360° Izq(11)</span></button>
                                <div class="d-flex align-items-center justify-content-center text-muted text-xs">Vel: <span id="currentSpeed" class="ms-1 text-light">180</span></div>
                                <button class="btn-gamepad" onclick="sendMovement(10)"><i class="bi bi-repeat"></i><span>360° Der(10)</span></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-tools">
                    <div class="card-custom" style="flex: 1;">
                        <div class="card-header-custom text-warning"><i class="bi bi-cone-striped me-2"></i>Obstáculos</div>
                        <div class="card-body-custom gap-2 p-2">
                            <div class="d-grid gap-1">
                                <button class="btn btn-sm btn-outline-warning text-start" onclick="sendObstacle(1)">1. Frente</button>
                                <button class="btn btn-sm btn-outline-warning text-start" onclick="sendObstacle(2)">2. Frente-Izq</button>
                                <button class="btn btn-sm btn-outline-warning text-start" onclick="sendObstacle(3)">3. Frente-Der</button>
                                <button class="btn btn-sm btn-outline-warning text-start" onclick="sendObstacle(4)">4. Múltiples</button>
                                <button class="btn btn-sm btn-outline-warning text-start" onclick="sendObstacle(5)">5. Atrás</button>
                            </div>
                            <div id="obstacleResult" class="p-2 bg-dark rounded border border-secondary text-xs hidden"></div>
                        </div>
                    </div>

                    <div class="card-custom" style="flex: 1;">
                        <div class="card-header-custom text-info"><i class="bi bi-shuffle me-2"></i>Random</div>
                        <div class="card-body-custom p-2 gap-2">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-dark border-secondary text-muted">Pasos</span>
                                <input type="number" id="nPasos" class="form-control bg-dark text-light border-secondary" value="5">
                            </div>
                            <div class="d-flex gap-1">
                                <input type="number" id="minMs" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Min" value="500">
                                <input type="number" id="maxMs" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Max" value="1500">
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="excluirDetener" checked>
                                <label class="form-check-label text-xs text-muted" for="excluirDetener">No Stop</label>
                            </div>
                            <button class="btn btn-sm btn-info w-100 mt-auto" onclick="createRandomDemo()">Generar</button>
                        </div>
                    </div>
                </div>

                <div class="col-demos">
                    <div class="card-custom h-100">
                        <div class="card-header-custom text-success">
                            <span><i class="bi bi-pencil-square me-2"></i>Manual</span>
                        </div>
                        <div class="card-body-custom p-2 gap-2">
                            <select id="manualOpSelect" class="form-select form-select-sm bg-dark text-light border-secondary">
                                <option value="1">1. Adelante</option>
                                <option value="2">2. Atrás</option>
                                <option value="3">3. Detener</option>
                                <option value="4">4. Vuelta Adelante Der</option>
                                <option value="5">5. Vuelta Adelante Izq</option>
                                <option value="6">6. Vuelta Atrás Der</option>
                                <option value="7">7. Vuelta Atrás Izq</option>
                                <option value="8">8. Giro 90° Der</option>
                                <option value="9">9. Giro 90° Izq</option>
                                <option value="10">10. Giro 360° Der</option>
                                <option value="11">11. Giro 360° Izq</option>
                            </select>
                            
                            <div class="input-group input-group-sm">
                                <input type="number" id="manualDurInput" class="form-control bg-dark text-light border-secondary" placeholder="ms" value="1000">
                                <button class="btn btn-outline-success" onclick="addManualStep()"><i class="bi bi-plus-lg"></i></button>
                            </div>

                            <div id="manualStepsPreview" class="log-container" style="flex: 1; min-height: 50px;">
                                <p class="text-muted text-center my-2">Sin pasos</p>
                            </div>

                            <div class="d-flex gap-1">
                                <button class="btn btn-sm btn-outline-danger flex-fill" onclick="clearManualSteps()"><i class="bi bi-trash"></i></button>
                                <button class="btn btn-sm btn-success flex-fill" onclick="finalizeManualDemo()">Crear</button>
                            </div>
                            
                            <hr class="border-secondary my-1">
                            
                            <button class="btn btn-sm btn-outline-secondary w-100 mb-1" onclick="loadLast20Demos()">Cargar Historial</button>
                            <div id="demoList" class="log-container" style="flex: 1; max-height: 150px;"></div>
                        </div>
                    </div>
                </div>
            </div>

        </section>

        <section class="panel-monitor">
            
            <div style="flex: 1; display: flex; gap: 0.5rem; min-height: 0;">
                <div class="card-custom" style="flex: 1;">
                    <div class="card-header-custom">
                        <span>Movimientos</span>
                        <button class="btn btn-sm p-0 text-muted" onclick="loadMovementLogs()"><i class="bi bi-arrow-clockwise"></i></button>
                    </div>
                    <div class="card-body-custom p-0">
                        <div id="lastMovement" class="p-2 border-bottom border-secondary bg-dark text-xs text-info fw-bold"></div>
                        <div id="last10Movements" class="log-container border-0 h-100"></div>
                    </div>
                </div>
                <div class="card-custom" style="flex: 1;">
                    <div class="card-header-custom text-warning">
                        <span>Obstáculos</span>
                        <button class="btn btn-sm p-0 text-muted" onclick="loadObstacleLogs()"><i class="bi bi-arrow-clockwise"></i></button>
                    </div>
                    <div class="card-body-custom p-0">
                        <div id="lastObstacle" class="p-2 border-bottom border-secondary bg-dark text-xs text-warning fw-bold"></div>
                        <div id="last10Obstacles" class="log-container border-0 h-100"></div>
                    </div>
                </div>
            </div>

            <div class="card-custom" style="flex: 1; min-height: 0;">
                <div class="card-header-custom text-primary d-flex justify-content-between">
                    <span>Ejecución en Tiempo Real</span>
                    <!--
                    <div class="d-flex gap-1">
                        <button id="btnReanudarSecuencia" class="btn btn-xs btn-success py-0 px-2" onclick="reanudarSecuencia()" disabled><i class="bi bi-play-fill"></i></button>
                        <button id="btnPausarSecuencia" class="btn btn-xs btn-warning py-0 px-2" onclick="pausarSecuencia()" disabled><i class="bi bi-pause-fill"></i></button>
                        <button id="btnDetenerSecuencia" class="btn btn-xs btn-danger py-0 px-2" onclick="detenerSecuencia()" disabled><i class="bi bi-stop-fill"></i></button>
                    </div>
                    -->

                </div>
                
                <div class="card-body-custom p-3 gap-2">
                    <div id="estadoSecuencia" class="d-flex justify-content-between bg-dark border border-secondary rounded p-2 text-xs">
                        <div class="text-center">
                            <span class="text-muted d-block">ID</span>
                            <span id="secuenciaIdActual" class="text-light fw-bold">-</span>
                        </div>
                        <div class="text-center">
                            <span class="text-muted d-block">Paso</span>
                            <span id="pasoActualSecuencia" class="text-info fw-bold">-</span>
                        </div>
                        <div class="text-center">
                            <span class="text-muted d-block">Restante</span>
                            <span id="tiempoRestanteSecuencia" class="text-warning fw-bold">-</span>
                        </div>
                        <div class="text-center">
                            <span class="text-muted d-block">%</span>
                            <span id="progresoTexto" class="text-success fw-bold">0%</span>
                        </div>
                    </div>

                    <div class="d-none">
                        <span id="totalPasosSecuencia"></span>
                        <span id="progresoDetalle"></span>
                    </div>

                    <div class="progress bg-dark border border-secondary" style="height: 8px;">
                        <div id="barraProgresoSecuencia" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width: 0%"></div>
                    </div>

                    <div id="infoPasoActual" class="d-flex justify-content-between text-xs text-muted hidden">
                        <span>Op: <span id="operacionActual" class="text-light fw-bold">-</span></span>
                        <span>Dur: <span id="duracionActual" class="text-light fw-bold">-</span></span>
                    </div>

                    <div class="d-flex flex-column flex-grow-1" style="min-height: 0;">
                        <span class="text-xs text-muted mb-1">Log de Secuencia:</span>
                        <div id="logEjecucionSecuencia" class="log-container h-100">
                            <p class="text-muted text-center mt-3">Esperando secuencia...</p>
                        </div>
                    </div>
                    
                    <div id="wsLog" class="d-none"></div> 
                </div>
            </div>

        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
